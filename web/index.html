<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>youcreate</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --accent-dim: #2a4a8a;
    --error: #ff6b6b;
    --success: #4fd18b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  main {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label.dropzone {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    transition: border-color 0.15s, color 0.15s;
  }
  label.dropzone:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  label.dropzone.has-file {
    border-color: var(--accent);
    color: var(--text);
  }
  input[type="file"] {
    display: none;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: var(--accent-dim);
    color: var(--muted);
    cursor: not-allowed;
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin: 12px 0 8px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #progress-msg {
    margin-top: 4px;
    font-size: 0.9rem;
  }
  .trim-hint {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 12px;
  }
  #preview-video {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 12px;
    background: #000;
  }
  .trim-track {
    position: relative;
    height: 36px;
    border-radius: 8px;
    background: var(--border);
    touch-action: none;
  }
  .trim-window {
    position: absolute;
    top: 0;
    height: 100%;
    min-width: 6px;
    background: var(--accent);
    border-radius: 6px;
    cursor: grab;
    opacity: 0.85;
  }
  .trim-window:active {
    cursor: grabbing;
  }
  .trim-times {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .downloads {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .downloads a {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    background: var(--border);
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .downloads a:hover {
    background: var(--accent-dim);
  }
  .status-title {
    font-weight: 600;
    margin-bottom: 8px;
  }
  .status-title.success { color: var(--success); }
  .status-title.error { color: var(--error); }
  #error-msg {
    font-size: 0.9rem;
    color: var(--muted);
    word-break: break-word;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>youcreate</h1>
  <p class="subtitle">Envie um vídeo em inglês e receba de volta com legenda e dublagem em português.</p>

  <div class="panel">
    <label class="dropzone" id="dropzone" for="file-input">
      <span id="dropzone-text">Selecione um arquivo .mp4</span>
    </label>
    <input type="file" id="file-input" accept="video/mp4,.mp4">
    <button id="submit-btn" disabled>Traduzir e legendar</button>
  </div>

  <div class="panel" id="trim-section" hidden>
    <p class="trim-hint">Esse vídeo passa de 1 minuto. Arraste a faixa abaixo para escolher qual trecho de até 1 minuto será localizado.</p>
    <video id="preview-video" muted playsinline></video>
    <div class="trim-track" id="trim-track">
      <div class="trim-window" id="trim-window"></div>
    </div>
    <div class="trim-times">
      <span id="trim-start-label">00:00</span>
      <span id="trim-end-label">01:00</span>
    </div>
  </div>

  <div class="panel" id="progress-section" hidden>
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="progress-row">
      <span id="progress-step"></span>
      <span id="progress-pct">0%</span>
    </div>
    <div id="progress-msg"></div>
  </div>

  <div class="panel" id="result-section" hidden>
    <div class="status-title success">Concluído</div>
    <div class="downloads">
      <a id="video-link" href="#" hidden>Baixar vídeo dublado (.mp4)</a>
      <a id="srt-link" href="#" hidden>Baixar legenda (.srt)</a>
    </div>
  </div>

  <div class="panel" id="error-section" hidden>
    <div class="status-title error">Ocorreu um erro</div>
    <div id="error-msg"></div>
  </div>
</main>

<script>
  const MAX_CLIP_SECONDS = 60;

  const fileInput = document.getElementById('file-input');
  const dropzone = document.getElementById('dropzone');
  const dropzoneText = document.getElementById('dropzone-text');
  const submitBtn = document.getElementById('submit-btn');

  const trimSection = document.getElementById('trim-section');
  const previewVideo = document.getElementById('preview-video');
  const trimTrack = document.getElementById('trim-track');
  const trimWindow = document.getElementById('trim-window');
  const trimStartLabel = document.getElementById('trim-start-label');
  const trimEndLabel = document.getElementById('trim-end-label');

  let videoDuration = 0;
  let clipStart = 0;
  let needsTrim = false;

  const progressSection = document.getElementById('progress-section');
  const progressBar = document.getElementById('progress-bar');
  const progressPct = document.getElementById('progress-pct');
  const progressStep = document.getElementById('progress-step');
  const progressMsg = document.getElementById('progress-msg');

  const resultSection = document.getElementById('result-section');
  const videoLink = document.getElementById('video-link');
  const srtLink = document.getElementById('srt-link');

  const errorSection = document.getElementById('error-section');
  const errorMsg = document.getElementById('error-msg');

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    submitBtn.disabled = !file;
    dropzone.classList.toggle('has-file', !!file);
    dropzoneText.textContent = file ? file.name : 'Selecione um arquivo .mp4';

    trimSection.hidden = true;
    needsTrim = false;
    clipStart = 0;
    if (!file) return;

    previewVideo.src = URL.createObjectURL(file);
    previewVideo.onloadedmetadata = () => {
      videoDuration = previewVideo.duration;
      if (videoDuration > MAX_CLIP_SECONDS) {
        needsTrim = true;
        trimSection.hidden = false;
        setClipStart(0);
      }
    };
  });

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function setClipStart(newStart) {
    const maxStart = Math.max(videoDuration - MAX_CLIP_SECONDS, 0);
    clipStart = Math.min(Math.max(newStart, 0), maxStart);

    const windowPct = Math.min(MAX_CLIP_SECONDS / videoDuration, 1) * 100;
    const leftPct = videoDuration ? (clipStart / videoDuration) * 100 : 0;
    trimWindow.style.width = windowPct + '%';
    trimWindow.style.left = leftPct + '%';

    trimStartLabel.textContent = formatTime(clipStart);
    trimEndLabel.textContent = formatTime(Math.min(clipStart + MAX_CLIP_SECONDS, videoDuration));
    previewVideo.currentTime = clipStart;
  }

  let dragging = false;
  let dragOffsetPct = 0;

  trimWindow.addEventListener('pointerdown', (e) => {
    dragging = true;
    const trackRect = trimTrack.getBoundingClientRect();
    const windowRect = trimWindow.getBoundingClientRect();
    dragOffsetPct = (e.clientX - windowRect.left) / trackRect.width;
    trimWindow.setPointerCapture(e.pointerId);
  });
  trimWindow.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const trackRect = trimTrack.getBoundingClientRect();
    const pct = (e.clientX - trackRect.left) / trackRect.width - dragOffsetPct;
    setClipStart(pct * videoDuration);
  });
  trimWindow.addEventListener('pointerup', () => { dragging = false; });

  trimTrack.addEventListener('click', (e) => {
    if (e.target === trimWindow) return;
    const trackRect = trimTrack.getBoundingClientRect();
    const pct = (e.clientX - trackRect.left) / trackRect.width;
    setClipStart(pct * videoDuration - MAX_CLIP_SECONDS / 2);
  });

  submitBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    resetPanels();
    setControlsEnabled(false);

    const formData = new FormData();
    formData.append('file', file);
    if (needsTrim) {
      formData.append('start', clipStart.toFixed(2));
      formData.append('clip_duration', String(MAX_CLIP_SECONDS));
    }

    let jobId;
    try {
      const resp = await fetch('/api/jobs', { method: 'POST', body: formData });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || 'Falha ao enviar o vídeo.');
      }
      const data = await resp.json();
      jobId = data.id;
    } catch (e) {
      showError(e.message);
      setControlsEnabled(true);
      return;
    }

    progressSection.hidden = false;
    const source = new EventSource(`/api/jobs/${jobId}/events`);

    source.onmessage = async (ev) => {
      const data = JSON.parse(ev.data);

      if (data.done) {
        source.close();
        if (data.status === 'done') {
          await showResult(jobId);
        } else {
          const status = await fetchStatus(jobId);
          showError(status.message || 'Ocorreu um erro no processamento.');
        }
        setControlsEnabled(true);
        return;
      }

      updateProgress(data.pct, data.label, data.message);
    };

    source.onerror = () => {
      source.close();
      showError('Conexão perdida com o servidor.');
      setControlsEnabled(true);
    };
  });

  function updateProgress(pct, step, message) {
    progressBar.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    progressStep.textContent = step || '';
    progressMsg.textContent = message || '';
  }

  async function fetchStatus(jobId) {
    const resp = await fetch(`/api/jobs/${jobId}`);
    return resp.json();
  }

  async function showResult(jobId) {
    const status = await fetchStatus(jobId);
    updateProgress(100, 'Concluído', 'Processamento concluído.');
    resultSection.hidden = false;

    if (status.video) {
      videoLink.href = `/api/download/${status.video}`;
      videoLink.hidden = false;
    }
    if (status.srt) {
      srtLink.href = `/api/download/${status.srt}`;
      srtLink.hidden = false;
    }
  }

  function showError(message) {
    errorSection.hidden = false;
    errorMsg.textContent = message;
  }

  function resetPanels() {
    progressSection.hidden = true;
    resultSection.hidden = true;
    errorSection.hidden = true;
    videoLink.hidden = true;
    srtLink.hidden = true;
    updateProgress(0, '', '');
  }

  function setControlsEnabled(enabled) {
    submitBtn.disabled = !enabled || !fileInput.files.length;
    fileInput.disabled = !enabled;
    trimSection.style.pointerEvents = enabled ? 'auto' : 'none';
    trimSection.style.opacity = enabled ? '1' : '0.6';
  }
</script>
</body>
</html>
