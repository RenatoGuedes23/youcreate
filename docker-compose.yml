services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    build:
      context: ./webapp
    env_file: webapp/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - outputs:/app/storage/outputs
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    env_file: worker/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - outputs:/app/storage/outputs
      - whisper-cache:/root/.cache/huggingface
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      # Fase de teste: 1 replica basta (processa 1 video por vez). Para
      # produção com processamento simultâneo, escale via
      # `docker compose up -d --scale worker=N` (não precisa editar este
      # arquivo) ou suba este valor de volta.
      replicas: 1

volumes:
  redis-data:
  outputs:
  whisper-cache:
